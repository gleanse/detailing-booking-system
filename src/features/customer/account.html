<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Herco Detailing Garage</title>
  <link rel="stylesheet" href="/css/output.css">
  <link rel="stylesheet" href="/styles/custom.css">
  <link rel="stylesheet" href="/phosphor/regular/style.css">
</head>
<body class="bg-[#0a0a0a] min-h-screen text-white overflow-x-hidden">

  <!-- MAIN -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-10">

    <div class="mb-10 animate-fadeUp">
      <h1 class="text-5xl font-bold tracking-wide" style="font-family:'Bebas Neue',sans-serif;">My Account</h1>
    </div>

      <div class="flex flex-col gap-6">

        <!-- Profile Card -->
        <div class="bg-neutral-900 border border-white/6 rounded-2xl p-6 animate-fadeUp">

          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
              <div
                class="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center shrink-0">
                <i class="ph ph-user text-white text-2xl"></i>
              </div>
              <div>
                <p id="profile-name" class="text-white font-semibold text-lg leading-tight">-</p>
                <p id="profile-email" class="text-white/40 text-xs mt-0.5">-</p>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-3 mb-6">
            <div class="flex items-center gap-3 bg-white/3 rounded-xl px-4 py-3">
              <i class="ph ph-phone text-red-500 text-sm flex-shrink-0"></i>
              <div>
                <p class="text-white/30 text-xs uppercase tracking-widest">Phone</p>
                <p id="profile-phone" class="text-white text-sm font-medium">-</p>
              </div>
            </div>
            <div class="flex items-center gap-3 bg-white/3 rounded-xl px-4 py-3">
              <i class="ph ph-envelope text-red-500 text-sm flex-shrink-0"></i>
              <div>
                <p class="text-white/30 text-xs uppercase tracking-widest">Email</p>
                <p id="profile-email-2" class="text-white text-sm font-medium">-</p>
              </div>
            </div>
          </div>

        </div>

        <!-- Edit Profile Form -->
        <div id="edit-profile-form" class="bg-neutral-900 border border-white/6 rounded-2xl p-6 animate-fadeUp">
          <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
            <i class="ph ph-pencil text-red-500"></i>
            Edit Profile
          </h3>
          <div class="flex flex-col gap-4">
            <div>
              <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">Full Name</label>
              <input id="edit-name" type="text"
                class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 text-white text-sm transition-colors duration-200" />
              <p id="edit-error-name" class="hidden text-red-400 text-xs mt-1"></p>
            </div>
            <div>
              <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">Phone Number</label>
              <input id="edit-phone" type="tel" maxlength="11"
                class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 text-white text-sm transition-colors duration-200" />
              <p id="edit-error-phone" class="hidden text-red-400 text-xs mt-1"></p>
            </div>
            <p id="edit-form-error" class="hidden text-red-400 text-xs"></p>
            <p id="edit-form-success" class="hidden text-green-400 text-xs"></p>
            <div class="flex gap-3">
              <button id="btn-save-profile" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white text-sm font-semibold py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2">
                <i class="ph ph-floppy-disk text-sm" id="save-icon"></i>
                <span id="save-text">Save</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Change Email Form -->
        <div id="change-email-section" class="bg-neutral-900 border border-white/6 rounded-2xl p-6 animate-fadeUp">
          <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
            <i class="ph ph-envelope text-red-500"></i>
            Change Email
          </h3>
          <div class="flex flex-col gap-4">

            <!-- Step 1: new email input -->
            <div id="email-step-1">
              <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">New Email Address</label>
              <input id="change-email-input" type="email"
                class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 text-white text-sm transition-colors duration-200"
                placeholder="Enter new email" />
              <p id="email-step1-error" class="hidden text-red-400 text-xs mt-1"></p>
              <p id="email-step1-success" class="hidden text-green-400 text-xs mt-1"></p>
              <div class="flex gap-3 mt-4">
                <button id="btn-send-otp"
                  class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white text-sm font-semibold py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2"> 
                  <i class="ph ph-paper-plane-tilt text-sm" id="send-otp-icon"></i>
                  <span id="send-otp-text">Send Code</span>
                </button>
              </div>
            </div>

            <!-- Step 2: OTP input (hidden until code sent) -->
            <div id="email-step-2" class="hidden flex-col gap-4">
              <div>
                <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">Verification Code</label>
                <p class="text-white/30 text-xs mb-1">Enter the 6-digit code sent to your new email.</p>
                <p id="otp-expires-in" class="text-yellow-400 text-xs mb-3"></p>
                <input id="otp-input" type="text" maxlength="6"
                  class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 text-white text-sm tracking-[0.3em] text-center transition-colors duration-200"
                  placeholder="000000" />
                <p id="email-step2-error" class="hidden text-red-400 text-xs mt-1"></p>
                <p id="email-step2-success" class="hidden text-green-400 text-xs mt-1"></p>
              </div>
              <div class="flex gap-3">
                <button id="btn-back-email"
                  class="w-1/2 border border-white/10 hover:border-white/30 text-white/60 hover:text-white text-sm font-medium py-2.5 rounded-xl transition-all duration-200">
                  Back
                </button>
                <button id="btn-verify-otp"
                  class="w-1/2 bg-red-600 hover:bg-red-700 active:scale-95 text-white text-sm font-semibold py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2">
                  <i class="ph ph-check text-sm" id="verify-otp-icon"></i>
                  <span id="verify-otp-text">Verify</span>
                </button>
              </div>
              <button id="btn-resend-otp"
                class="text-xs text-white/30 transition-colors duration-200 text-center disabled:opacity-40 disabled:cursor-not-allowed">
                <span id="resend-otp-text">Resend code</span>
              </button>
            </div>

          </div>
        </div>

        <!-- Change Password Form -->
        <div id="change-password-section" class="bg-neutral-900 border border-white/6 rounded-2xl p-6 animate-fadeUp">
          <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
            <i class="ph ph-lock-key text-red-500"></i>
            Change Password
          </h3>

          <div class="flex flex-col gap-4">
            <div>
              <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">Current Password</label>
              <div class="relative">
                <input id="current-password" type="password"
                  class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 pr-11 text-white text-sm transition-colors duration-200"
                  placeholder="Enter current password" />
                <button type="button"
                  class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/60 transition-colors"
                  data-target="current-password">
                  <i class="ph ph-eye text-lg"></i>
                </button>
              </div>
              <p id="error-current-password" class="hidden text-red-400 text-xs mt-1"></p>
            </div>
            <div>
              <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">New Password</label>
              <div class="relative">
                <input id="new-password" type="password"
                  class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 pr-11 text-white text-sm transition-colors duration-200"
                  placeholder="At least 8 characters" />
                <button type="button"
                  class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/60 transition-colors"
                  data-target="new-password">
                  <i class="ph ph-eye text-lg"></i>
                </button>
              </div>
              <p id="error-new-password" class="hidden text-red-400 text-xs mt-1"></p>
            </div>
            <div>
              <label class="text-xs text-white/40 uppercase tracking-widest mb-2 block">Confirm New Password</label>
              <div class="relative">
                <input id="confirm-password" type="password"
                  class="w-full bg-white/4 border border-white/8 focus:border-red-500 outline-none rounded-xl px-4 py-3 pr-11 text-white text-sm transition-colors duration-200"
                  placeholder="Re-enter new password" />
                <button type="button"
                  class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/60 transition-colors"
                  data-target="confirm-password">
                  <i class="ph ph-eye text-lg"></i>
                </button>
              </div>
              <p id="error-confirm-password" class="hidden text-red-400 text-xs mt-1"></p>
            </div>
            <p id="change-password-error" class="hidden text-red-400 text-xs"></p>
            <p id="change-password-success" class="hidden text-green-400 text-xs"></p>
            <div class="flex gap-3">
              <button id="btn-save-password"
                class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white text-sm font-semibold py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2"> 
                <i class="ph ph-floppy-disk text-sm" id="save-password-icon"></i>
                <span id="save-password-text">Save</span>
              </button>
            </div>
          </div>

        </div>
        <button id="btn-logout" type="button"
          class="w-full flex items-center justify-center gap-2 text-sm text-red-400 border border-red-500/20 hover:border-red-500/40 py-3 rounded-xl transition-colors">
          <i class="ph ph-sign-out text-base"></i>
          Sign out
        </button>

      </div>
  </main>

  <script src="/customer/shell.js"></script>
  <script src="/customer/account.js"></script>

</body>
</html>
