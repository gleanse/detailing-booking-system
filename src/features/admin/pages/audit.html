<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs Herco Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/output.css">
  <style>
    body { display: flex; }
    .layout-wrapper { display: flex; width: 100%; }
    #app { display: contents; }
  </style>
</head>
<body>

<div id="app">
  <div class="page-header">
    <div>
      <h1 class="page-title">Audit Logs</h1>
      <p class="page-sub">Track all system actions and changes</p>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Action</th><th>By</th><th>Table</th><th>Details</th><th>Date & Time</th></tr>
        </thead>
        <tbody id="auditTableBody">
          <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="auditModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3>Audit Detail</h3>
      <button class="modal-close" id="auditModalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Action</p>
      <p id="auditAction" style="color:var(--color-admin-text);font-weight:500;word-break:break-word;"></p>

      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Done by</p>
      <p id="auditUser" style="color:var(--color-admin-text);"></p>

      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Table</p>
      <p id="auditTable" style="color:var(--color-admin-text);"></p>

      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Target ID</p>
      <p id="auditTarget" style="color:var(--color-admin-text);word-break:break-all;"></p>

      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Details</p>
      <p id="auditDetails" style="color:var(--color-admin-text);white-space:pre-wrap;word-break:break-word;"></p>

      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Date and time</p>
      <p id="auditDate" style="color:var(--color-admin-text);margin-bottom:0;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="auditModalDone">Close</button>
    </div>
  </div>
</div>

<script src="/admin/admin-layout.js"></script>
<script src="audit.js"></script>

</body>
</html>
