<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - Herco Detailing Garage</title>
  <link rel="stylesheet" href="/css/output.css">
  <link rel="stylesheet" href="/styles/custom.css">
  <link rel="stylesheet" href="/phosphor/regular/style.css">
  <link rel="stylesheet" href="/fonts/big-shoulders/latin-800.css">
  <link rel="stylesheet" href="/fonts/big-shoulders/latin-500.css">
</head>
<body class="bg-[#0a0a0a] min-h-screen text-white overflow-x-hidden">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 border-b border-white/10 bg-ink-black/80 backdrop-blur-lg animate-slideDown">
    <div class="max-w-6xl mx-auto px-5 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="flex items-center gap-2.5" aria-label="Herco Detailing Garage home">
          <img src="/Images/herco-logo.jpeg" alt="" width="40" height="40" class="size-10 shrink-0 rounded-lg object-cover">
          <span class="flex flex-col leading-none">
            <span class="font-heading text-2xl font-extrabold tracking-wider text-white">HERCO</span>
            <span class="text-xs text-white/50 mt-0.5">Detailing Garage</span>
          </span>
        </a>

        <nav class="hidden md:flex items-center gap-8">
          <a href="/services" class="nav-link active text-sm">Services</a>
          <a href="/#about" class="nav-link text-sm text-white/60 hover:text-white transition-colors duration-200">About</a>
          <a href="/track" class="nav-link text-sm text-white/60 hover:text-white transition-colors duration-200">Track booking</a>
          <a href="/customer/login" class="nav-link text-sm text-white/60 hover:text-white transition-colors duration-200">Sign in</a>
        </nav>

        <a href="/services"
          class="hidden md:flex book-now-btn items-center gap-2 rounded-xl bg-red-600 hover:bg-red-700 px-5 py-2.5 text-sm font-semibold text-white shadow-glow-sm transition-colors duration-200">
          <i class="ph ph-calendar-plus text-base"></i>
          Book now
        </a>

        <button id="menu-toggle" class="md:hidden size-11 -mr-2 flex flex-col items-center justify-center gap-1.25 cursor-pointer"
          aria-label="Open menu" aria-controls="mobile-menu">
          <span class="w-5 h-px bg-white/70" id="bar1"></span>
          <span class="w-5 h-px bg-white/70" id="bar2"></span>
          <span class="w-5 h-px bg-white/70" id="bar3"></span>
        </button>
      </div>
    </div>

    <div id="mobile-menu" class="md:hidden border-t border-white/10 bg-ink-900">
      <div class="max-w-6xl mx-auto px-5 py-3 flex flex-col">
        <a href="/services" class="py-4 text-base text-white border-b border-white/5">Services</a>
        <a href="/#about" class="py-4 text-base text-white/70 hover:text-white border-b border-white/5 transition-colors">About</a>
        <a href="/track" class="py-4 text-base text-white/70 hover:text-white border-b border-white/5 transition-colors">Track booking</a>
        <a href="/customer/login" class="py-4 text-base text-white/70 hover:text-white border-b border-white/5 transition-colors">Sign in</a>
        <a href="/services"
          class="mt-3 flex h-12 items-center justify-center rounded-xl bg-red-600 hover:bg-red-700 text-base font-semibold text-white shadow-glow-sm transition-colors">Book now</a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-6 py-12 relative z-10">

    <div class="mb-10 animate-fadeUp">
      <h2 class="text-5xl font-bold mb-2 tracking-wide" style="font-family:'Bebas Neue',sans-serif;">Our Services</h2>
      <p class="text-white/50 text-sm font-light">Choose a service to get started</p>
    </div>

    <div id="services" class="-mx-3 flex flex-wrap justify-center">
      <!-- Skeleton placeholders while loading -->
      <div class="w-full max-w-md p-3 md:w-1/2 md:max-w-none lg:w-1/3">
        <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
          <div class="skeleton-img w-full h-48"></div>
          <div class="p-6 flex flex-col gap-3">
            <div class="skeleton-line h-3 rounded-full" style="width:60%"></div>
            <div class="skeleton-line h-3 rounded-full" style="width:90%"></div>
            <div class="skeleton-line h-3 rounded-full" style="width:75%"></div>
          </div>
        </div>
      </div>
      <div class="w-full max-w-md p-3 md:w-1/2 md:max-w-none lg:w-1/3">
        <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
          <div class="skeleton-img w-full h-48"></div>
          <div class="p-6 flex flex-col gap-3">
            <div class="skeleton-line h-3 rounded-full" style="width:55%"></div>
            <div class="skeleton-line h-3 rounded-full" style="width:85%"></div>
            <div class="skeleton-line h-3 rounded-full" style="width:70%"></div>
          </div>
        </div>
      </div>
      <div class="w-full max-w-md p-3 md:w-1/2 md:max-w-none lg:w-1/3">
        <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
          <div class="skeleton-img w-full h-48"></div>
          <div class="p-6 flex flex-col gap-3">
            <div class="skeleton-line h-3 rounded-full" style="width:65%"></div>
            <div class="skeleton-line h-3 rounded-full" style="width:80%"></div>
            <div class="skeleton-line h-3 rounded-full" style="width:60%"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Mobile menu
    const toggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('mobile-menu');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    let menuOpen = false;
    toggle.addEventListener('click', () => {
      menuOpen = !menuOpen;
      menu.classList.toggle('open', menuOpen);
      bar1.style.transform = menuOpen ? 'translateY(6px) rotate(45deg)' : '';
      bar2.style.opacity = menuOpen ? '0' : '';
      bar3.style.transform = menuOpen ? 'translateY(-6px) rotate(-45deg)' : '';
    });

    // Services
    const container = document.getElementById('services');

    const esc = (value) =>
      String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    const peso = (value) => `₱${Number(value).toLocaleString()}`;
    const VISIBLE_VARIANTS = 2;
    const chipClass = 'rounded-full bg-white/7 px-2.5 py-0.5 text-xs text-white/70';
    const syncers = [];

    const renderChips = (variants) => {
      const list = (variants || []).filter((v) => v && v.id);
      const chips = list
        .map(
          (v, i) =>
            `<span class="${chipClass} ${i >= VISIBLE_VARIANTS ? 'extra-chip hidden' : ''}">${esc(v.name)} ${peso(v.price)}</span>`,
        )
        .join('');
      const rest = list.length - VISIBLE_VARIANTS;
      return rest > 0
        ? chips + `<span class="${chipClass} more-chip">+${rest}</span>`
        : chips;
    };

    const renderCard = (service, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'animate-card w-full max-w-md p-3 md:w-1/2 md:max-w-none lg:w-1/3';
      wrap.style.animationDelay = `${i * 0.1}s`;
      wrap.innerHTML = /* html */ `
        <div class="group relative isolate flex h-full flex-col overflow-hidden rounded-2xl border border-white/10 bg-neutral-900 transition-all duration-300 hover:-translate-y-1 hover:border-red-500">
          <span class="pointer-events-none absolute inset-0 -z-10 bg-linear-to-r from-red-500/10 to-transparent to-60%"></span>
          <span class="pointer-events-none absolute inset-0 -z-10 bg-red-500/0 transition-colors duration-300 group-hover:bg-red-500/5"></span>

          <div class="relative flex h-40 shrink-0 items-center justify-center overflow-hidden bg-linear-to-br from-red-950 to-neutral-900">
            <i class="ph ph-wrench text-5xl text-white/15"></i>
            ${
              service.image_url
                ? `<img data-fallback src="${esc(service.image_url)}" alt="${esc(service.name)}" class="absolute inset-0 size-full object-cover brightness-90 transition-all duration-500 group-hover:scale-105 group-hover:brightness-100">`
                : ''
            }
          </div>

          <div class="flex flex-1 flex-col p-5">
            <div class="mb-2 flex items-center gap-2">
              <i class="ph ph-wrench text-xl text-red-500 transition-transform duration-300 group-hover:rotate-12"></i>
              <h3 class="text-xl font-semibold">${esc(service.name)}</h3>
            </div>

            <div class="md:min-h-18">
              <p class="desc line-clamp-2 text-sm leading-relaxed text-white/50">${esc(service.description)}</p>
              <button type="button" class="toggle-more mt-1.5 hidden cursor-pointer items-center gap-1 text-xs text-red-400 hover:text-red-300">
                <span class="toggle-label">See more</span>
                <i class="ph ph-caret-down toggle-icon text-xs transition-transform duration-200"></i>
              </button>
            </div>

            <p class="mt-3 font-semibold text-red-500">Starting at ${peso(service.price)}</p>
            <p class="mt-1 text-xs text-white/40">Estimated prices. Final price is confirmed in shop after inspection.</p>

            <div class="mt-3 flex items-center justify-between border-t border-white/10 pt-3 text-sm">
              <span class="text-white/50">Down payment</span>
              <span class="font-medium text-white">${peso(service.down_payment_amount)}</span>
            </div>

            <div class="mt-3 md:min-h-12">
              <p class="mb-2 text-xs uppercase tracking-widest text-white/30">Variants</p>
              <div class="flex flex-wrap gap-1.5">${renderChips(service.variants)}</div>
            </div>

            <div class="mt-auto pt-5">
              <button type="button" class="book-btn flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg bg-red-600 py-2 font-semibold text-white transition-all duration-200 hover:bg-red-500 active:scale-95">
                <i class="ph ph-calendar"></i>
                Book Now
              </button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(wrap);

      const desc = wrap.querySelector('.desc');
      const toggle = wrap.querySelector('.toggle-more');
      const label = wrap.querySelector('.toggle-label');
      const icon = wrap.querySelector('.toggle-icon');
      const extras = wrap.querySelectorAll('.extra-chip');
      const moreChip = wrap.querySelector('.more-chip');
      let open = false;

      const sync = () => {
        const needed =
          open || desc.scrollHeight > desc.clientHeight || extras.length > 0;
        toggle.classList.toggle('hidden', !needed);
      };
      syncers.push(() => {
        if (!open) sync();
      });
      sync();

      toggle.addEventListener('click', () => {
        open = !open;
        desc.classList.toggle('line-clamp-2', !open);
        extras.forEach((chip) => chip.classList.toggle('hidden', !open));
        if (moreChip) moreChip.classList.toggle('hidden', open);
        label.textContent = open ? 'See less' : 'See more';
        icon.classList.toggle('rotate-180', open);
      });

      wrap.querySelectorAll('img[data-fallback]').forEach((img) => {
        img.addEventListener('error', () => img.remove());
      });

      wrap.querySelector('.book-btn').addEventListener('click', () => {
        window.location.href = `/booking/${service.id}`;
      });
    };

    const showMessage = (text) => {
      container.innerHTML = `<p class="w-full py-10 text-center text-sm text-white/30">${text}</p>`;
    };

    fetch('/api/services/list')
      .then((res) => res.json())
      .then((data) => {
        container.innerHTML = '';
        if (!data.data || data.data.length === 0) {
          showMessage('No services available right now.');
          return;
        }
        data.data.forEach(renderCard);
        if (document.fonts) {
          document.fonts.ready.then(() => syncers.forEach((fn) => fn()));
        }
      })
      .catch(() => showMessage('Could not load services. Please refresh.'));

    window.addEventListener('resize', () => syncers.forEach((fn) => fn()));
  </script> 

</body>
</html>
