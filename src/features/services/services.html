<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - Herco Detailing Garage</title>
  <link rel="stylesheet" href="/css/output.css">
  <link rel="stylesheet" href="/styles/custom.css">
  <link rel="stylesheet" href="/phosphor/regular/style.css">
  <link rel="stylesheet" href="/fonts/big-shoulders/latin-800.css">
  <link rel="stylesheet" href="/fonts/big-shoulders/latin-500.css">
</head>
<body class="bg-[#0a0a0a] min-h-screen text-white overflow-x-hidden">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 border-b border-white/10 bg-ink-black/80 backdrop-blur-lg animate-slideDown">
    <div class="max-w-6xl mx-auto px-5 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="flex items-center gap-2.5" aria-label="Herco Detailing Garage home">
          <img src="/Images/herco-logo.jpeg" alt="" width="40" height="40" class="size-10 shrink-0 rounded-lg object-cover">
          <span class="flex flex-col leading-none">
            <span class="font-heading text-2xl font-extrabold tracking-wider text-white">HERCO</span>
            <span class="text-xs text-white/50 mt-0.5">Detailing Garage</span>
          </span>
        </a>

        <nav class="hidden md:flex items-center gap-8">
          <a href="/services" class="nav-link active text-sm">Services</a>
          <a href="/#about" class="nav-link text-sm text-white/60 hover:text-white transition-colors duration-200">About</a>
          <a href="/track" class="nav-link text-sm text-white/60 hover:text-white transition-colors duration-200">Track booking</a>
          <a href="/customer/login" class="nav-link text-sm text-white/60 hover:text-white transition-colors duration-200">Sign in</a>
        </nav>

        <a href="/services"
          class="hidden md:flex book-now-btn items-center gap-2 rounded-xl bg-red-600 hover:bg-red-700 px-5 py-2.5 text-sm font-semibold text-white shadow-glow-sm transition-colors duration-200">
          <i class="ph ph-calendar-plus text-base"></i>
          Book now
        </a>

        <button id="menu-toggle" class="md:hidden size-11 -mr-2 flex flex-col items-center justify-center gap-1.25 cursor-pointer"
          aria-label="Open menu" aria-controls="mobile-menu">
          <span class="w-5 h-px bg-white/70" id="bar1"></span>
          <span class="w-5 h-px bg-white/70" id="bar2"></span>
          <span class="w-5 h-px bg-white/70" id="bar3"></span>
        </button>
      </div>
    </div>

    <div id="mobile-menu" class="md:hidden border-t border-white/10 bg-ink-900">
      <div class="max-w-6xl mx-auto px-5 py-3 flex flex-col">
        <a href="/services" class="py-4 text-base text-white border-b border-white/5">Services</a>
        <a href="/#about" class="py-4 text-base text-white/70 hover:text-white border-b border-white/5 transition-colors">About</a>
        <a href="/track" class="py-4 text-base text-white/70 hover:text-white border-b border-white/5 transition-colors">Track booking</a>
        <a href="/customer/login" class="py-4 text-base text-white/70 hover:text-white border-b border-white/5 transition-colors">Sign in</a>
        <a href="/services"
          class="mt-3 flex h-12 items-center justify-center rounded-xl bg-red-600 hover:bg-red-700 text-base font-semibold text-white shadow-glow-sm transition-colors">Book now</a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-6 py-12 relative z-10">

    <div class="mb-10 animate-fadeUp">
      <h2 class="text-5xl font-bold mb-2 tracking-wide" style="font-family:'Bebas Neue',sans-serif;">Our Services</h2>
      <p class="text-white/50 text-sm font-light">Choose a service to get started</p>
    </div>

    <div id="services" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Skeleton placeholders while loading -->
      <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
        <div class="skeleton-img w-full h-48"></div>
        <div class="p-6 flex flex-col gap-3">
          <div class="skeleton-line h-3 rounded-full" style="width:60%"></div>
          <div class="skeleton-line h-3 rounded-full" style="width:90%"></div>
          <div class="skeleton-line h-3 rounded-full" style="width:75%"></div>
        </div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
        <div class="skeleton-img w-full h-48"></div>
        <div class="p-6 flex flex-col gap-3">
          <div class="skeleton-line h-3 rounded-full" style="width:55%"></div>
          <div class="skeleton-line h-3 rounded-full" style="width:85%"></div>
          <div class="skeleton-line h-3 rounded-full" style="width:70%"></div>
        </div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
        <div class="skeleton-img w-full h-48"></div>
        <div class="p-6 flex flex-col gap-3">
          <div class="skeleton-line h-3 rounded-full" style="width:65%"></div>
          <div class="skeleton-line h-3 rounded-full" style="width:80%"></div>
          <div class="skeleton-line h-3 rounded-full" style="width:60%"></div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Mobile menu
    const toggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('mobile-menu');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    let menuOpen = false;
    toggle.addEventListener('click', () => {
      menuOpen = !menuOpen;
      menu.classList.toggle('open', menuOpen);
      bar1.style.transform = menuOpen ? 'translateY(6px) rotate(45deg)' : '';
      bar2.style.opacity = menuOpen ? '0' : '';
      bar3.style.transform = menuOpen ? 'translateY(-6px) rotate(-45deg)' : '';
    });

    // Services
    fetch('/api/services/list')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('services');
        container.innerHTML = '';
        data.data.forEach((service, i) => {
          const card = document.createElement('div');
          card.className = 'service-card animate-card bg-white/5 border border-white/10 rounded-2xl overflow-hidden hover:border-red-500 hover:-translate-y-1 transition-all duration-300 cursor-default group relative';
          card.style.animationDelay = `${i * 0.1}s`;
          card.innerHTML = /* html */`
            <div class="card-img-wrap relative overflow-hidden">
              <img src="${service.image_url}" alt="${service.name}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500 brightness-[0.85] group-hover:brightness-100">
            </div>
            <div class="p-6 relative z-10">
              <div class="flex items-center gap-2 mb-3">
                <i class="ph ph-wrench text-red-500 text-xl group-hover:rotate-12 transition-transform duration-300"></i>
                <h3 class="text-xl font-semibold">${service.name}</h3>
              </div>
              <p class="text-white/50 text-sm mb-4 leading-relaxed">${service.description}</p>
              <p class="text-red-500 font-semibold">Starting at ₱${Number(service.price).toLocaleString()}</p>
              <p class="text-white/40 text-xs mt-1 mb-4">Estimated prices. Final price is confirmed in shop after inspection.</p>
              <div class="flex justify-between items-center text-sm mb-4">
                <span class="text-white/50">Down payment</span>
                <span class="text-white font-medium">₱${Number(service.down_payment_amount).toLocaleString()}</span>
              </div>
              <div class="border-t border-white/10 pt-4">
                <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Variants</p>
                <div class="flex flex-col gap-2">
                  ${service.variants.map(v => /* html */`
                    <div class="flex justify-between items-center text-sm">
                      <span class="text-white/70">${v.name}</span>
                      <span class="text-white font-medium">₱${v.price}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
              <button class="cursor-pointer book-btn mt-6 w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-semibold py-2 rounded-lg transition-all duration-200 flex items-center justify-center gap-2 relative overflow-hidden">
                <i class="ph ph-calendar"></i>
                Book Now
              </button>
            </div>
          `;
          container.appendChild(card);
          card.querySelector('.book-btn').addEventListener('click', () => {
            window.location.href = `/booking/${service.id}`;
          });
        });
      });
  </script> 

</body>
</html>
